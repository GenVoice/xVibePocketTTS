<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="Voices — три пресета и клонирование" width="100%">
  <title>Voices</title>
  <desc>Three voice presets and custom cloning, shown as equalizer-style fingerprints.</desc>

  <defs>
    <style>
      .bg     { fill: #f7f4ec; }
      .card   { fill: #ffffff; stroke: #e2dccb; stroke-width: 1.5; }
      .ink    { fill: #1a1a1a; font-family: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace; }
      .mute   { fill: #6a6356; font-family: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace; }
      .bar    { fill: #1a1a1a; }
      .barAcc { fill: #c6432a; }
      .code   { fill: #f1ead7; stroke: #d8cfb4; stroke-width: 1; }
      @media (prefers-color-scheme: dark) {
        .bg     { fill: #0f1115; }
        .card   { fill: #161a22; stroke: #2a3140; }
        .ink    { fill: #e8e6df; }
        .mute   { fill: #9aa0ac; }
        .bar    { fill: #e8e6df; }
        .barAcc { fill: #ff7a59; }
        .code   { fill: #1d2330; stroke: #2f3849; }
      }
    </style>
  </defs>

  <rect class="bg" width="1200" height="260"/>

  <!-- Card 1: male_deep -->
  <g transform="translate(60,40)">
    <rect class="card" width="260" height="180" rx="16" ry="16"/>
    <text class="mute" x="20" y="32" font-size="18">PRESET</text>
    <text class="ink"   x="20" y="64" font-size="26" font-weight="700">male_deep</text>
    <text class="mute" x="20" y="88" font-size="18">default</text>
    <g transform="translate(20,108)">
      <rect class="bar"    x="0"   y="20" width="14" height="44"/>
      <rect class="bar"    x="22"  y="8"  width="14" height="56"/>
      <rect class="barAcc" x="44"  y="0"  width="14" height="64"/>
      <rect class="bar"    x="66"  y="14" width="14" height="50"/>
      <rect class="bar"    x="88"  y="32" width="14" height="32"/>
      <rect class="bar"    x="110" y="22" width="14" height="42"/>
      <rect class="bar"    x="132" y="40" width="14" height="24"/>
      <rect class="barAcc" x="154" y="6"  width="14" height="58"/>
      <rect class="bar"    x="176" y="20" width="14" height="44"/>
      <rect class="bar"    x="198" y="34" width="14" height="30"/>
    </g>
    <rect class="code" x="20" y="150" width="220" height="20" rx="6" ry="6"/>
    <text class="ink"  x="30" y="165" font-size="13">--voice male_deep</text>
  </g>

  <!-- Card 2: female_silky -->
  <g transform="translate(340,40)">
    <rect class="card" width="260" height="180" rx="16" ry="16"/>
    <text class="mute" x="20" y="32" font-size="18">PRESET</text>
    <text class="ink"   x="20" y="64" font-size="26" font-weight="700">female_silky</text>
    <text class="mute" x="20" y="88" font-size="18">soft</text>
    <g transform="translate(20,108)">
      <rect class="bar"    x="0"   y="40" width="14" height="24"/>
      <rect class="barAcc" x="22"  y="14" width="14" height="50"/>
      <rect class="bar"    x="44"  y="20" width="14" height="44"/>
      <rect class="bar"    x="66"  y="6"  width="14" height="58"/>
      <rect class="barAcc" x="88"  y="0"  width="14" height="64"/>
      <rect class="bar"    x="110" y="18" width="14" height="46"/>
      <rect class="bar"    x="132" y="32" width="14" height="32"/>
      <rect class="bar"    x="154" y="12" width="14" height="52"/>
      <rect class="barAcc" x="176" y="22" width="14" height="42"/>
      <rect class="bar"    x="198" y="36" width="14" height="28"/>
    </g>
    <rect class="code" x="20" y="150" width="220" height="20" rx="6" ry="6"/>
    <text class="ink"  x="30" y="165" font-size="13">--voice female_silky</text>
  </g>

  <!-- Card 3: male_authoritative -->
  <g transform="translate(620,40)">
    <rect class="card" width="260" height="180" rx="16" ry="16"/>
    <text class="mute" x="20" y="32" font-size="18">PRESET</text>
    <text class="ink"   x="20" y="64" font-size="22" font-weight="700">male_authoritative</text>
    <text class="mute" x="20" y="88" font-size="18">confident</text>
    <g transform="translate(20,108)">
      <rect class="bar"    x="0"   y="14" width="14" height="50"/>
      <rect class="bar"    x="22"  y="22" width="14" height="42"/>
      <rect class="bar"    x="44"  y="6"  width="14" height="58"/>
      <rect class="barAcc" x="66"  y="0"  width="14" height="64"/>
      <rect class="bar"    x="88"  y="12" width="14" height="52"/>
      <rect class="bar"    x="110" y="20" width="14" height="44"/>
      <rect class="barAcc" x="132" y="2"  width="14" height="62"/>
      <rect class="bar"    x="154" y="16" width="14" height="48"/>
      <rect class="bar"    x="176" y="26" width="14" height="38"/>
      <rect class="bar"    x="198" y="10" width="14" height="54"/>
    </g>
    <rect class="code" x="20" y="150" width="220" height="20" rx="6" ry="6"/>
    <text class="ink"  x="30" y="165" font-size="13">--voice male_authoritative</text>
  </g>

  <!-- Card 4: custom clone -->
  <g transform="translate(900,40)">
    <rect class="card" width="240" height="180" rx="16" ry="16"/>
    <text class="mute" x="20" y="32" font-size="18">CUSTOM</text>
    <text class="ink"   x="20" y="64" font-size="26" font-weight="700">клонирование</text>
    <text class="mute" x="20" y="88" font-size="18">.wav / .safetensors</text>
    <g transform="translate(20,108)">
      <path d="M 0 32 C 20 4, 40 60, 60 32 S 100 4, 120 32 S 160 60, 180 32"
            stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path class="barAcc" d="M 60 32 l -6 -10 m 6 10 l -6 10" stroke-width="2.4" fill="#c6432a" stroke="#c6432a"/>
    </g>
    <rect class="code" x="20" y="150" width="200" height="20" rx="6" ry="6"/>
    <text class="ink"  x="30" y="165" font-size="12">--voice ref.wav</text>
  </g>
</svg>
