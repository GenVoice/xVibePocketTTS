<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Performance — RTF и скорость на Ryzen 7 3700X и RTX 3090" width="100%">
  <title>Performance</title>
  <desc>Two bars per machine showing RTF and real-time speed multiplier; RTX 3090 is faster.</desc>

  <defs>
    <style>
      .bg     { fill: #f7f4ec; }
      .card   { fill: #ffffff; stroke: #e2dccb; stroke-width: 1.5; }
      .ink    { fill: #1a1a1a; font-family: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace; }
      .mute   { fill: #6a6356; font-family: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace; }
      .ax     { stroke: #c7bfa8; stroke-width: 1; }
      .grid   { stroke: #ece5d0; stroke-width: 1; }
      .barCPU { fill: #1a1a1a; }
      .barGPU { fill: #c6432a; }
      .pill   { fill: #f1ead7; stroke: #d8cfb4; stroke-width: 1; }
      @media (prefers-color-scheme: dark) {
        .bg     { fill: #0f1115; }
        .card   { fill: #161a22; stroke: #2a3140; }
        .ink    { fill: #e8e6df; }
        .mute   { fill: #9aa0ac; }
        .ax     { stroke: #3b4252; }
        .grid   { stroke: #1f2530; }
        .barCPU { fill: #e8e6df; }
        .barGPU { fill: #ff7a59; }
        .pill   { fill: #1d2330; stroke: #2f3849; }
      }
    </style>
  </defs>

  <rect class="bg" width="1200" height="320"/>

  <!-- Card: RTF -->
  <g transform="translate(60,40)">
    <rect class="card" width="540" height="240" rx="16" ry="16"/>
    <text class="mute" x="24" y="32" font-size="14">RTF ↓ МЕНЬШЕ — ЛУЧШЕ</text>
    <text class="ink"   x="24" y="60" font-size="20" font-weight="700">Real-Time Factor</text>

    <!-- baseline + grid -->
    <line class="ax"   x1="100" y1="200" x2="500" y2="200"/>
    <line class="grid" x1="100" y1="160" x2="500" y2="160"/>
    <line class="grid" x1="100" y1="120" x2="500" y2="120"/>
    <line class="grid" x1="100" y1="80"  x2="500" y2="80"/>

    <text class="mute" x="60" y="84"  font-size="12" text-anchor="end">0.1</text>
    <text class="mute" x="60" y="124" font-size="12" text-anchor="end">0.3</text>
    <text class="mute" x="60" y="164" font-size="12" text-anchor="end">0.5</text>

    <!-- bars: scale RTF visually; 0.412 -> 80px, 0.138 -> 26px above baseline 200 -->
    <g>
      <rect class="barCPU" x="170" y="120" width="80" height="80"/>
      <text class="ink" x="210" y="112" font-size="18" font-weight="700" text-anchor="middle">0.412</text>
      <text class="mute" x="210" y="222" font-size="18" text-anchor="middle">Ryzen 7 3700X</text>
    </g>
    <g>
      <rect class="barGPU" x="340" y="174" width="80" height="26"/>
      <text class="ink" x="380" y="166" font-size="18" font-weight="700" text-anchor="middle">0.138</text>
      <text class="mute" x="380" y="222" font-size="18" text-anchor="middle">RTX 3090</text>
    </g>
  </g>

  <!-- Card: speed -->
  <g transform="translate(620,40)">
    <rect class="card" width="520" height="240" rx="16" ry="16"/>
    <text class="mute" x="24" y="32" font-size="14">СКОРОСТЬ ↑ БОЛЬШЕ — ЛУЧШЕ</text>
    <text class="ink"   x="24" y="60" font-size="20" font-weight="700">× realtime</text>

    <line class="ax"   x1="100" y1="200" x2="480" y2="200"/>
    <line class="grid" x1="100" y1="160" x2="480" y2="160"/>
    <line class="grid" x1="100" y1="120" x2="480" y2="120"/>
    <line class="grid" x1="100" y1="80"  x2="480" y2="80"/>

    <text class="mute" x="60" y="84"  font-size="12" text-anchor="end">2×</text>
    <text class="mute" x="60" y="124" font-size="12" text-anchor="end">4×</text>
    <text class="mute" x="60" y="164" font-size="12" text-anchor="end">6×</text>

    <!-- 2.42x -> 48px, 7.26x -> 145px above baseline 200 -->
    <g>
      <rect class="barCPU" x="160" y="152" width="80" height="48"/>
      <text class="ink" x="200" y="144" font-size="18" font-weight="700" text-anchor="middle">2.42×</text>
      <text class="mute" x="200" y="222" font-size="18" text-anchor="middle">Ryzen 7 3700X</text>
    </g>
    <g>
      <rect class="barGPU" x="320" y="55" width="80" height="145"/>
      <text class="ink" x="360" y="47" font-size="18" font-weight="700" text-anchor="middle">7.26×</text>
      <text class="mute" x="360" y="222" font-size="18" text-anchor="middle">RTX 3090</text>
    </g>
  </g>
</svg>
