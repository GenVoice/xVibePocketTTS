[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xvibe-pocket-tts"
version = "0.1.0"
description = "Русский full fine-tune Pocket TTS от GenVoice"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
    "pocket-tts==3.0.2",
    "torch>=2.5.0",
    "beartype>=0.22.5,<0.23",
    "pyyaml>=6.0,<7",
    "soundfile>=0.12,<0.15",
    "ruaccent==1.5.8.3",
    "transformers==4.57.6",
    "onnxruntime==1.23.2",
    "huggingface-hub>=0.36,<1",
]

[project.optional-dependencies]
demo = ["gradio==6.10.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12", "build>=1.2"]

[project.scripts]
xvibe-tts = "xvibe_pocket_tts.cli:main"

[project.urls]
Homepage = "https://genvoice.ru/?utm_source=github"
Repository = "https://github.com/GenVoice/xVibePocketTTS"
Model = "https://huggingface.co/genvoice/xVibePocketTTS"
Demo = "https://huggingface.co/spaces/Brakanier/xVibePocketTTS"

[tool.hatch.build.targets.wheel]
packages = ["src/xvibe_pocket_tts"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real model loading and synthesis; downloads model files"]
